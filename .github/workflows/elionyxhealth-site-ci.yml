name: elionyxhealth-site CI

on:
  push:
    branches: [main]
    paths:
      - 'elionyxhealth-site/**'
      - '.github/workflows/elionyxhealth-site-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'elionyxhealth-site/**'
      - '.github/workflows/elionyxhealth-site-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elionyxhealth-site

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: elionyxhealth-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
